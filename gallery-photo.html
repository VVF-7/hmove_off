<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото — ХМОВЕ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f4fd;
            --text-color: #2d2d2d;
            --accent-primary: #9d4edd;
            --accent-deep: #7b2cbf;
            --accent-yellow: #ffcc00;
            --gradient-text: linear-gradient(to right, #7b2cbf, #9d4edd);
            --shadow: 0 10px 30px rgba(123, 44, 191, 0.1);
            --transition: all 0.3s ease;
        }

        /* --- Темная тема --- */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f0f0f0;
        }

        body.dark-mode header {
            background: rgba(30, 30, 30, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .section-header p { color: #aaa; }
        body.dark-mode .back-link { color: var(--accent-primary); }

        /* Стили для кнопки переключения темы */
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            margin-left: 15px;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { transform: rotate(15deg); }
        .theme-toggle svg { width: 24px; height: 24px; fill: var(--text-color); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; overflow-x: hidden; padding-bottom: 60px; }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header Styles */
        header { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 1rem 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }
        .cross-icon-svg { width: 24px; height: 24px; animation: pulse 3s infinite; }
        @keyframes pulse { 0% { fill: var(--accent-primary); } 50% { fill: var(--accent-yellow); } 100% { fill: var(--accent-primary); } }

        /* Gallery Styles */
        .section-header { text-align: center; margin-bottom: 4rem; padding-top: 120px; }
        .section-header h2 { font-size: 2.5rem; text-align: center; margin-bottom: 1rem; background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-header p { color: #666; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent-deep); font-weight: 600; }

        /* Grid Layout (Восстановлен) */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 12px; aspect-ratio: 1 / 1; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.3s; }
        .gallery-item:hover { transform: translateY(-5px); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Lightbox Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; backdrop-filter: blur(5px); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .close-modal { position: absolute; top: 20px; right: 30px; font-size: 3rem; color: white; cursor: pointer; z-index: 3001; transition: color 0.2s; }
        .close-modal:hover { color: var(--accent-yellow); }
        
        .lightbox-img { max-width: 90%; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: opacity 0.3s; opacity: 0; position: absolute; }
        .modal-overlay.active .lightbox-img { opacity: 1; position: relative; }

        /* Lightbox Navigation Buttons */
        .lightbox-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3002;
            font-size: 1.5rem;
            transition: all 0.2s;
        }
        .lightbox-nav-btn:hover { background: var(--accent-primary); border-color: var(--accent-primary); }
        .lightbox-nav-btn.prev { left: 20px; }
        .lightbox-nav-btn.next { right: 20px; }

        @media (max-width: 768px) {
            .lightbox-nav-btn { width: 40px; height: 40px; font-size: 1.2rem; }
            .close-modal { top: 10px; right: 15px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <svg class="cross-icon-svg" viewBox="0 0 24 24"><rect x="10" y="2" width="4" height="20" rx="2" /><rect x="5" y="8" width="14" height="4" rx="2" /></svg>
                    ХМОВЕ
                </a>
                <div style="font-weight: 600; font-size: 0.9rem;"><a href="index.html#gallery">Вернуться</a></div>
                
                <!-- Кнопка переключения темы -->
                <button class="theme-toggle" id="themeToggle" aria-label="Сменить тему">
                    <svg class="sun-icon" style="display: block;" viewBox="0 0 24 24">
                        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                    </svg>
                    <svg class="moon-icon" style="display: none;" viewBox="0 0 24 24">
                        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="section-header">
                <a href="index.html#gallery" class="back-link">← Назад к категориям</a>
                <h2>Фото</h2>
                <p>Кликни на фото, чтобы открыть и листать</p>
            </div>

            <div class="gallery-grid">
                <!-- ФОТО 21 (Самая новая) -->
                <!-- onclick="openLightbox(0)" так как это первый элемент в массиве -->
                <div class="gallery-item" onclick="openLightbox(0)">
                    <img src="my-photo21.jpg" alt="Фото 21">
                </div>

                <!-- ФОТО 20 -->
                <div class="gallery-item" onclick="openLightbox(1)">
                    <img src="my-photo20.jpg" alt="Фото 20">
                </div>

                <!-- ФОТО 19 -->
                <div class="gallery-item" onclick="openLightbox(2)">
                    <img src="my-photo19.jpg" alt="Фото 19">
                </div>

                <!-- ФОТО 18 -->
                <div class="gallery-item" onclick="openLightbox(3)">
                    <img src="my-photo18.jpg" alt="Фото 18">
                </div>

                <!-- ФОТО 17 -->
                <div class="gallery-item" onclick="openLightbox(4)">
                    <img src="my-photo17.jpg" alt="Фото 17">
                </div>

                <!-- ФОТО 16 -->
                <div class="gallery-item" onclick="openLightbox(5)">
                    <img src="my-photo16.jpg" alt="Фото 16">
                </div>

                <!-- ФОТО 15 -->
                <div class="gallery-item" onclick="openLightbox(6)">
                    <img src="my-photo15.jpg" alt="Фото 15">
                </div>

                <!-- ФОТО 14 -->
                <div class="gallery-item" onclick="openLightbox(7)">
                    <img src="my-photo14.jpg" alt="Фото 14">
                </div>

                <!-- ФОТО 13 -->
                <div class="gallery-item" onclick="openLightbox(8)">
                    <img src="my-photo13.jpg" alt="Фото 13">
                </div>

                <!-- ФОТО 12 -->
                <div class="gallery-item" onclick="openLightbox(9)">
                    <img src="my-photo12.jpg" alt="Фото 12">
                </div>

                <!-- ФОТО 11 -->
                <div class="gallery-item" onclick="openLightbox(10)">
                    <img src="my-photo11.jpg" alt="Фото 11">
                </div>

                <!-- ФОТО 10 -->
                <div class="gallery-item" onclick="openLightbox(11)">
                    <img src="my-photo10.jpg" alt="Фото 10">
                </div>

                <!-- ФОТО 9 -->
                <div class="gallery-item" onclick="openLightbox(12)">
                    <img src="my-photo9.jpg" alt="Фото 9">
                </div>

                <!-- ФОТО 8 -->
                <div class="gallery-item" onclick="openLightbox(13)">
                    <img src="my-photo8.jpg" alt="Фото 8">
                </div>

                <!-- ФОТО 7 -->
                <div class="gallery-item" onclick="openLightbox(14)">
                    <img src="my-photo7.jpg" alt="Фото 7">
                </div>

                <!-- ФОТО 6 -->
                <div class="gallery-item" onclick="openLightbox(15)">
                    <img src="my-photo6.jpg" alt="Фото 6">
                </div>

                <!-- ФОТО 5 -->
                <div class="gallery-item" onclick="openLightbox(16)">
                    <img src="my-photo5.jpg" alt="Фото 5">
                </div>

                <!-- ФОТО 4 -->
                <div class="gallery-item" onclick="openLightbox(17)">
                    <img src="my-photo4.jpg" alt="Фото 4">
                </div>

                <!-- ФОТО 3 -->
                <div class="gallery-item" onclick="openLightbox(18)">
                    <img src="my-photo3.jpg" alt="Фото 3">
                </div>
                
                <!-- ФОТО 2 -->
                <div class="gallery-item" onclick="openLightbox(19)">
                    <img src="my-photo2.jpg" alt="Фото 2">
                </div>

                <!-- ФОТО 1 (Самая старая) -->
                <div class="gallery-item" onclick="openLightbox(20)">
                    <img src="my-photo1.jpg" alt="Фото 1">
                </div>
            </div>
        </div>
    </section>

    <!-- Lightbox с Навигацией -->
    <div id="lightbox" class="modal-overlay" onclick="closeLightbox(event)">
        <span class="close-modal" onclick="closeLightbox(event)">&times;</span>
        
        <!-- Кнопка Назад -->
        <button class="lightbox-nav-btn prev" onclick="changePhoto(-1)">&#10094;</button>
        
        <img class="lightbox-img" id="lightbox-img" src="" alt="Full view">
        
        <!-- Кнопка Вперед -->
        <button class="lightbox-nav-btn next" onclick="changePhoto(1)">&#10095;</button>
    </div>

    <script>
        // Список всех фотографий (важно: сохранять порядок 21 -> 1)
        const images = [
            'my-photo21.jpg', 'my-photo20.jpg', 'my-photo19.jpg', 'my-photo18.jpg', 'my-photo17.jpg', 
            'my-photo16.jpg', 'my-photo15.jpg', 'my-photo14.jpg', 'my-photo13.jpg', 'my-photo12.jpg', 
            'my-photo11.jpg', 'my-photo10.jpg', 'my-photo9.jpg', 'my-photo8.jpg', 'my-photo7.jpg', 
            'my-photo6.jpg', 'my-photo5.jpg', 'my-photo4.jpg', 'my-photo3.jpg', 'my-photo2.jpg', 'my-photo1.jpg'
        ];
        
        let currentIndex = 0;

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // Открытие фото по индексу
        function openLightbox(index) {
            currentIndex = index;
            showPhoto(currentIndex);
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Показ фото и обновление фона
        function showPhoto(index) {
            // Мгновенное исчезновение для плавности
            lightboxImg.style.opacity = '0';
            
            setTimeout(() => {
                lightboxImg.src = images[index];
                lightboxImg.style.opacity = '1';
            }, 100);
        }

        // Переключение фото (Вперед / Назад)
        function changePhoto(direction) {
            currentIndex += direction;

            // Зацикливание (цикл): если вперед больше конца - в начало, если назад меньше 0 - в конец
            if (currentIndex >= images.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }
            
            showPhoto(currentIndex);
        }

        // Закрытие
        function closeLightbox(event) {
            // Закрываем, если клик был не по картинке и не по кнопкам навигации
            if (event.target !== lightboxImg && !event.target.classList.contains('lightbox-nav-btn')) {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        // Поддержка клавиш (Стрелки влево/вправо)
        document.addEventListener('keydown', function(event) {
            if (!lightbox.classList.contains('active')) return;
            
            if (event.key === 'ArrowLeft') {
                changePhoto(-1);
            } else if (event.key === 'ArrowRight') {
                changePhoto(1);
            } else if (event.key === 'Escape') {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        });

        // --- Темная тема ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.querySelector('.sun-icon');
        const moonIcon = document.querySelector('.moon-icon');

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            if (isDark) {
                localStorage.setItem('theme', 'dark');
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                localStorage.setItem('theme', 'light');
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        });
    </script>
</body>
</html>
