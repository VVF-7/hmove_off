<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото — ХМОВЕ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f4fd;
            --text-color: #2d2d2d;
            --accent-primary: #9d4edd;
            --accent-deep: #7b2cbf;
            --accent-yellow: #ffcc00;
            --gradient-text: linear-gradient(to right, #7b2cbf, #9d4edd);
            --shadow: 0 10px 30px rgba(123, 44, 191, 0.1);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; overflow-x: hidden; padding-bottom: 60px; }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header Styles */
        header { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 1rem 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }
        .cross-icon-svg { width: 24px; height: 24px; animation: pulse 3s infinite; }
        @keyframes pulse { 0% { fill: var(--accent-primary); } 50% { fill: var(--accent-yellow); } 100% { fill: var(--accent-primary); } }

        /* Gallery Styles */
        .section-header { text-align: center; margin-bottom: 2rem; padding-top: 120px; }
        .section-header h2 { font-size: 2.5rem; text-align: center; margin-bottom: 1rem; background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-header p { color: #666; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent-deep); font-weight: 600; }

        /* Slider Container */
        .gallery-wrapper {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Buttons */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: var(--accent-deep);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
            font-size: 1.5rem;
            padding-bottom: 4px;
        }

        .slider-btn:hover {
            background: var(--accent-primary);
            transform: translateY(-50%) scale(1.1);
        }

        .slider-btn.left { left: 0; }
        .slider-btn.right { right: 0; }

        /* The Scroll Track */
        .gallery-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 20px;
            padding: 10px 60px; /* Padding for buttons */
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Скрываем скроллбар для красоты */
        }

        .gallery-item {
            flex: 0 0 300px; /* Ширина карточки */
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
            scroll-snap-align: center;
            transition: transform 0.3s;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Mobile tweak for slider items */
        @media (max-width: 768px) {
            .gallery-item { flex: 0 0 85%; } /* Занимаем почти весь экран на мобильном */
            .gallery-slider { padding: 10px 20px; }
        }

        /* Lightbox Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; backdrop-filter: blur(5px); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .close-modal { position: absolute; top: 20px; right: 30px; font-size: 3rem; color: white; cursor: pointer; z-index: 3001; }
        .lightbox-img { max-width: 90%; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

                    ХМОВЕ

    <!-- Lightbox -->
    <div id="lightbox" class="modal-overlay" onclick="closeLightbox(event)">
        <span class="close-modal" onclick="closeLightbox(event)">&times;</span>
        <img class="lightbox-img" id="lightbox-img" src="" alt="Full view">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // --- 1. Логика Слайдера (Скролл стрелками) ---
        function scrollSlider(direction) {
            const slider = document.getElementById('gallerySlider');
            const scrollAmount = 320; // Примерно ширина карточки + отступ
            
            slider.scrollBy({
                left: direction * scrollAmount,
                behavior: 'smooth'
            });
        }

        // --- 2. Логика Лайтбокса ---
        function openLightbox(element) {
            const imgSrc = element.querySelector('img').src; 
            lightboxImg.src = imgSrc;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (event.target !== lightboxImg) {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
    </script>
