    <style>
        :root {
            --bg-color: #f8f4fd;
            --text-color: #2d2d2d;
            --accent-primary: #9d4edd;
            --accent-deep: #7b2cbf;
            --accent-yellow: #ffcc00;
            --gradient-text: linear-gradient(to right, #7b2cbf, #9d4edd);
            --shadow: 0 10px 30px rgba(123, 44, 191, 0.1);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; overflow-x: hidden; padding-bottom: 60px; }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header Styles */
        header { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 1rem 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }
        .cross-icon-svg { width: 24px; height: 24px; animation: pulse 3s infinite; }
        @keyframes pulse { 0% { fill: var(--accent-primary); } 50% { fill: var(--accent-yellow); } 100% { fill: var(--accent-primary); } }

        /* Gallery Styles */
        .section-header { text-align: center; margin-bottom: 4rem; padding-top: 120px; }
        .section-header h2 { font-size: 2.5rem; text-align: center; margin-bottom: 1rem; background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-header p { color: #666; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent-deep); font-weight: 600; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 12px; aspect-ratio: 16/9; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.3s; background: #000; }
        .gallery-item:hover { transform: translateY(-5px); }
        
        /* Video Thumbnail Styles */
        .video-thumb {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.3s;
        }
        .gallery-item:hover .video-thumb { opacity: 1; }
        
        /* Play Icon Overlay */
        .play-icon-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; background: rgba(255,255,255,0.8); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; transition: transform 0.3s;
        }
        .play-icon-overlay svg { width: 30px; height: 30px; fill: var(--accent-deep); margin-left: 3px; }
        .gallery-item:hover .play-icon-overlay { transform: translate(-50%, -50%) scale(1.1); }

        /* Lightbox for Video */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; backdrop-filter: blur(5px); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .close-modal { position: absolute; top: 20px; right: 30px; font-size: 3rem; color: white; cursor: pointer; z-index: 3001; }
        
        /* Video Player in Lightbox */
        .lightbox-video-container { width: 90%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5); background: #000; }
        .lightbox-video { width: 100%; display: block; max-height: 80vh; aspect-ratio: 16/9; }
    </style>
</head>

    <!-- Lightbox for Films -->
    <div id="lightbox" class="modal-overlay" onclick="closeLightbox(event)">
        <span class="close-modal" onclick="closeLightbox(event)">&times;</span>
        <div class="lightbox-video-container" onclick="event.stopPropagation()">
            <video id="lightbox-video" class="lightbox-video" controls>
                Ваш браузер не поддерживает видео.
            </video>
        </div>
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxVideo = document.getElementById('lightbox-video');

        // Функция открытия видео или аудио в Lightbox
        function openVideoLightbox(videoSrc, posterSrc) {
            lightboxVideo.src = videoSrc;
            lightboxVideo.poster = posterSrc;
            lightboxVideo.play(); // Автоплей при открытии
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            // Закрываем, если клик не по самому видео-плееру
            if (event.target !== lightboxVideo) {
                lightboxVideo.pause();
                lightboxVideo.src = ""; // Очищаем источник
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }
    </script>
