<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f4fd;
            --text-color: #2d2d2d;
            --accent-primary: #9d4edd;
            --accent-deep: #7b2cbf;
            --accent-yellow: #ffcc00;
            --gradient-text: linear-gradient(to right, #7b2cbf, #9d4edd);
            --shadow: 0 10px 30px rgba(123, 44, 191, 0.1);
            --transition: all 0.3s ease;
        }

        /* --- Темная тема --- */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f0f0f0;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        body.dark-mode header {
            background: rgba(30, 30, 30, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .section-header p { color: #aaa; }
        body.dark-mode .back-link { color: var(--accent-primary); }
        
        body.dark-mode .gallery-item {
            background: #1e1e1e;
        }

        /* Стили для кнопки переключения темы */
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            margin-left: 15px;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { transform: rotate(15deg); }
        .theme-toggle svg { width: 24px; height: 24px; fill: var(--text-color); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; overflow-x: hidden; padding-bottom: 60px; padding-top: 80px; }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        header { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 1rem 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }
        .cross-icon-svg { width: 24px; height: 24px; animation: pulse 3s infinite; }
        @keyframes pulse { 0% { fill: var(--accent-primary); } 50% { fill: var(--accent-yellow); } 100% { fill: var(--accent-primary); } }

        .section-header { text-align: center; margin-bottom: 4rem; padding-top: 40px; }
        .section-header h2 { font-size: 2.5rem; text-align: center; margin-bottom: 1rem; background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-header p { color: #666; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent-deep); font-weight: 600; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 12px; aspect-ratio: 16/9; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.3s; background: #000; }
        .gallery-item:hover { transform: translateY(-5px); }
        
        .video-thumb { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.3s; }
        .gallery-item:hover .video-thumb { opacity: 1; }
        
        .play-icon-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; background: rgba(255,255,255,0.8); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; transition: transform 0.3s;
        }
        .play-icon-overlay svg { width: 30px; height: 30px; fill: var(--accent-deep); margin-left: 3px; }
        .gallery-item:hover .play-icon-overlay { transform: translate(-50%, -50%) scale(1.1); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; backdrop-filter: blur(5px); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .close-modal { position: absolute; top: 20px; right: 30px; font-size: 3rem; color: white; cursor: pointer; z-index: 3001; }
        .lightbox-video-container { width: 90%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5); background: #000; }
        .lightbox-video { width: 100%; display: block; max-height: 80vh; aspect-ratio: 16/9; }

        @media (max-width: 768px) {
            .section-header h2 { font-size: 1.8rem; }
            .gallery-grid { grid-template-columns: 1fr; }
            .close-modal { top: 10px; right: 15px; font-size: 2.5rem; }
        }
    </style>

    <div id="lightbox" class="modal-overlay" onclick="closeLightbox(event)">
        <span class="close-modal" onclick="closeLightbox(event)">&times;</span>
        <div class="lightbox-video-container" onclick="event.stopPropagation()">
            <video id="lightbox-video" class="lightbox-video" controls>
                Ваш браузер не поддерживает видео.
            </video>
        </div>
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxVideo = document.getElementById('lightbox-video');

        function openVideoLightbox(videoSrc, posterSrc) {
            lightboxVideo.src = videoSrc;
            lightboxVideo.poster = posterSrc;
            lightboxVideo.play();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (event.target !== lightboxVideo) {
                lightboxVideo.pause();
                lightboxVideo.src = "";
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        // --- Темная тема ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.querySelector('.sun-icon');
        const moonIcon = document.querySelector('.moon-icon');

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            if (isDark) {
                localStorage.setItem('theme', 'dark');
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                localStorage.setItem('theme', 'light');
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        });
    </script>
